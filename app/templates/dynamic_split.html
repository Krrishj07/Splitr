{% extends "base.html" %}

{% block title %}Dynamic Split - My Simple App{% endblock %}

{% block content %}
<h2>Bill Tracking</h2>

<div class="month-navigation">
    <button id="prev-month" onclick="changeMonth(-1)">&lt;</button>
    <h3 id="current-month">January 2024</h3>
    <button id="next-month" onclick="changeMonth(1)">&gt;</button>
</div>

<div class="bill-controls">
    <div class="form-group">
        <label for="user-select">Select User:</label>
        <select id="user-select" required>
            <option value="">Choose a user...</option>
            <option value="a">User A</option>
            <option value="b">User B</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="bill-select">Select Bill:</label>
        <select id="bill-select" required>
            <option value="">Choose a bill...</option>
            <option value="A.C.">A.C.</option>
            <option value="Electricity">Electricity</option>
            <option value="Water">Water</option>
            <option value="Internet">Internet</option>
        </select>
    </div>
    
    <button id="start-stop-btn" onclick="toggleTimer()" disabled>Start</button>
    <button id="clear-btn" onclick="clearTable()" style="background-color: #dc3545;">Clear Table</button>
    <button id="report-btn" onclick="generateReport()" style="background-color: #28a745;">Generate Report</button>
</div>

<!-- Manual entry form -->
<div class="bill-controls" style="margin-top: 10px;">
    <div class="form-group">
        <label for="manual-user">Manual User:</label>
        <select id="manual-user">
            <option value="">Choose a user...</option>
            <option value="a">User A</option>
            <option value="b">User B</option>
        </select>
    </div>
    <div class="form-group">
        <label for="manual-bill">Manual Bill:</label>
        <select id="manual-bill">
            <option value="">Choose a bill...</option>
            <option value="A.C.">A.C.</option>
            <option value="Electricity">Electricity</option>
            <option value="Water">Water</option>
            <option value="Internet">Internet</option>
        </select>
    </div>
    <div class="form-group">
        <label for="manual-seconds">Seconds:</label>
        <input type="number" id="manual-seconds" placeholder="e.g., 3600" min="0">
    </div>
    <button onclick="addManualEntry()" style="background-color: #17a2b8;">Add Entry</button>
</div>

<div class="bill-table-container">
    <table id="bill-table">
        <thead>
            <tr>
                <th>Bill Name</th>
                <th>Started by</th>
                <th>User Time</th>
                <th>Total Time</th>
            </tr>
        </thead>
        <tbody id="bill-tbody">
            <!-- Table rows will be added dynamically -->
        </tbody>
    </table>
</div>

<div class="current-timer">
    <h3>Current Session</h3>
    <div id="timer-display">00:00:00</div>
    <div id="current-bill-info"></div>
</div>

<!-- Report Modal -->
<div id="report-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>Bill Rates</h3>
        <p>Enter the monthly rates for each bill:</p>
        <div id="bill-rates"></div>
        <div style="margin-top: 20px;">
            <button onclick="generatePDF()" style="background-color: #28a745;">Generate PDF Report</button>
            <button onclick="closeModal()" style="background-color: #6c757d;">Cancel</button>
        </div>
    </div>
</div>

<script>
// Global variables
let isRunning = false;
let startTime = null;
let currentInterval = null;
let billData = {};
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

// Initialize the page
document.addEventListener('DOMContentLoaded', function() {
    const userSelect = document.getElementById('user-select');
    const billSelect = document.getElementById('bill-select');
    const startStopBtn = document.getElementById('start-stop-btn');
    
    // Enable/disable start button based on selections
    function updateStartButton() {
        if (userSelect.value && billSelect.value) {
            startStopBtn.disabled = false;
        } else {
            startStopBtn.disabled = true;
        }
    }
    
    userSelect.addEventListener('change', updateStartButton);
    billSelect.addEventListener('change', updateStartButton);
    
    // Load existing data from localStorage
    loadBillData();
    
    // Initialize month display
    updateMonthDisplay();
});

function toggleTimer() {
    if (!isRunning) {
        startTimer();
    } else {
        stopTimer();
    }
}

function startTimer() {
    const userSelect = document.getElementById('user-select');
    const billSelect = document.getElementById('bill-select');
    const startStopBtn = document.getElementById('start-stop-btn');
    
    const user = userSelect.value;
    const bill = billSelect.value;
    
    if (!user || !bill) {
        alert('Please select both user and bill');
        return;
    }
    
    isRunning = true;
    startTime = new Date();
    startStopBtn.textContent = 'Stop';
    startStopBtn.style.backgroundColor = '#dc3545';
    
    // Disable dropdowns while running
    userSelect.disabled = true;
    billSelect.disabled = true;
    
    // Show current session info
    document.getElementById('current-bill-info').textContent = 
        `User: ${user} | Bill: ${bill}`;
    
    // Start the timer display
    currentInterval = setInterval(updateTimerDisplay, 1000);
}

function stopTimer() {
    if (!isRunning) return;
    
    const userSelect = document.getElementById('user-select');
    const billSelect = document.getElementById('bill-select');
    const startStopBtn = document.getElementById('start-stop-btn');
    
    const user = userSelect.value;
    const bill = billSelect.value;
    const endTime = new Date();
    const duration = Math.floor((endTime - startTime) / 1000); // seconds
    
    // Create unique key for user-bill combination
    const key = `${user}-${bill}`;
    
    // Add to bill data
    if (!billData[key]) {
        billData[key] = {
            name: bill,
            startedBy: user,
            userTime: 0
        };
    }
    
    // Update user time
    billData[key].userTime += duration;
    
    // Update the table
    updateBillTable();
    
    // Reset UI
    isRunning = false;
    startStopBtn.textContent = 'Start';
    startStopBtn.style.backgroundColor = '#007bff';
    
    // Re-enable dropdowns
    userSelect.disabled = false;
    billSelect.disabled = false;
    
    // Clear current session info
    document.getElementById('current-bill-info').textContent = '';
    document.getElementById('timer-display').textContent = '00:00:00';
    
    // Stop timer display
    if (currentInterval) {
        clearInterval(currentInterval);
        currentInterval = null;
    }
    
    // Save data
    saveBillData();
}

function updateTimerDisplay() {
    if (!startTime) return;
    
    const now = new Date();
    const elapsed = Math.floor((now - startTime) / 1000);
    
    const hours = Math.floor(elapsed / 3600);
    const minutes = Math.floor((elapsed % 3600) / 60);
    const seconds = elapsed % 60;
    
    const timeString = 
        hours.toString().padStart(2, '0') + ':' +
        minutes.toString().padStart(2, '0') + ':' +
        seconds.toString().padStart(2, '0');
    
    document.getElementById('timer-display').textContent = timeString;
}

function updateBillTable() {
    const tbody = document.getElementById('bill-tbody');
    tbody.innerHTML = '';
    
    // Calculate total time for each bill type
    const billTotals = {};
    for (const key in billData) {
        const data = billData[key];
        if (!billTotals[data.name]) {
            billTotals[data.name] = 0;
        }
        billTotals[data.name] += data.userTime;
    }
    
    for (const key in billData) {
        const data = billData[key];
        
        // Add a new row for each unique user-bill combination
        const row = tbody.insertRow();
        row.insertCell(0).textContent = data.name;
        row.insertCell(1).textContent = data.startedBy;
        row.insertCell(2).textContent = formatTime(data.userTime);
        row.insertCell(3).textContent = formatTime(billTotals[data.name]);
    }
}

function formatTime(seconds) {
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    
    if (hours > 0) {
        return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    } else {
        return `${minutes}:${secs.toString().padStart(2, '0')}`;
    }
}

function saveBillData() {
    const monthKey = `${currentYear}-${currentMonth}`;
    localStorage.setItem(`billData-${monthKey}`, JSON.stringify(billData));
}

function loadBillData() {
    const monthKey = `${currentYear}-${currentMonth}`;
    const saved = localStorage.getItem(`billData-${monthKey}`);
    if (saved) {
        billData = JSON.parse(saved);
    } else {
        billData = {};
    }
    updateBillTable();
}

function clearTable() {
    if (confirm('Are you sure you want to clear all bill data for this month? This action cannot be undone.')) {
        billData = {};
        updateBillTable();
        const monthKey = `${currentYear}-${currentMonth}`;
        localStorage.removeItem(`billData-${monthKey}`);
        
        // Reset timer if running
        if (isRunning) {
            stopTimer();
        }
        
        // Reset dropdowns
        document.getElementById('user-select').value = '';
        document.getElementById('bill-select').value = '';
        document.getElementById('start-stop-btn').disabled = true;
        document.getElementById('start-stop-btn').textContent = 'Start';
        document.getElementById('start-stop-btn').style.backgroundColor = '#007bff';
    }
}

// Add manual entry without using timer
function addManualEntry() {
    const user = document.getElementById('manual-user').value;
    const bill = document.getElementById('manual-bill').value;
    let secs = parseInt(document.getElementById('manual-seconds').value || '0', 10);
    if (!user || !bill) {
        alert('Please select a user and bill for manual entry.');
        return;
    }
    if (isNaN(secs) || secs < 0) {
        alert('Please enter a valid number of seconds (0 or greater).');
        return;
    }

    const key = `${user}-${bill}`;
    if (!billData[key]) {
        billData[key] = { name: bill, startedBy: user, userTime: 0 };
    }
    billData[key].userTime += secs;
    saveBillData();
    updateBillTable();

    // clear inputs
    document.getElementById('manual-user').value = '';
    document.getElementById('manual-bill').value = '';
    document.getElementById('manual-seconds').value = '';
}

function changeMonth(direction) {
    // Save current month data before switching
    saveBillData();
    
    // Change month
    currentMonth += direction;
    
    // Handle year rollover
    if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
    } else if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
    }
    
    // Update display and load new month data
    updateMonthDisplay();
    loadBillData();
}

function updateMonthDisplay() {
    const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
    ];
    
    document.getElementById('current-month').textContent = 
        `${monthNames[currentMonth]} ${currentYear}`;
}

function generateReport() {
    // Check if there's any data
    if (Object.keys(billData).length === 0) {
        alert('No bill data available for this month.');
        return;
    }
    
    // Get unique bills
    const bills = [...new Set(Object.values(billData).map(data => data.name))];
    
    // Create rate input fields
    const ratesContainer = document.getElementById('bill-rates');
    ratesContainer.innerHTML = '';
    
    bills.forEach(bill => {
        const div = document.createElement('div');
        div.style.marginBottom = '10px';
        div.innerHTML = `
            <label for="rate-${bill}" style="display: inline-block; width: 120px;">${bill}:</label>
            <input type="number" id="rate-${bill}" placeholder="Monthly rate" min="0" step="0.01" style="width: 150px; padding: 5px;">
        `;
        ratesContainer.appendChild(div);
    });
    
    // Show modal
    document.getElementById('report-modal').style.display = 'block';
}

function closeModal() {
    document.getElementById('report-modal').style.display = 'none';
}

function generatePDF() {
    // Get rates
    const bills = [...new Set(Object.values(billData).map(data => data.name))];
    const rates = {};
    let allRatesEntered = true;
    
    bills.forEach(bill => {
        const rateInput = document.getElementById(`rate-${bill}`);
        const rate = parseFloat(rateInput.value);
        if (isNaN(rate) || rate < 0) {
            allRatesEntered = false;
            rateInput.style.borderColor = 'red';
        } else {
            rates[bill] = rate;
            rateInput.style.borderColor = '';
        }
    });
    
    if (!allRatesEntered) {
        alert('Please enter valid rates for all bills.');
        return;
    }
    
    // Calculate totals and splits
    const reportData = calculateReportData(rates);
    
    // Generate PDF content
    const pdfContent = generatePDFContent(reportData);
    
    // Create and download PDF
    downloadPDF(pdfContent);
    
    // Close modal
    closeModal();
}

function calculateReportData(rates) {
    const billTotals = {};
    const userTotals = { a: 0, b: 0 };
    const reportLines = [];
    
    // Calculate totals for each bill
    for (const key in billData) {
        const data = billData[key];
        if (!billTotals[data.name]) {
            billTotals[data.name] = { totalTime: 0, users: {} };
        }
        billTotals[data.name].totalTime += data.userTime;
        billTotals[data.name].users[data.startedBy] = data.userTime;
    }
    
    // Generate report lines
    for (const bill in billTotals) {
        const totalTime = billTotals[bill].totalTime;
        const rate = rates[bill];
        const totalCost = rate;
        
        const userATime = billTotals[bill].users['a'] || 0;
        const userBTime = billTotals[bill].users['b'] || 0;
        
        const userASplit = totalTime > 0 ? (userATime / totalTime) * totalCost : 0;
        const userBSplit = totalTime > 0 ? (userBTime / totalTime) * totalCost : 0;
        
        reportLines.push({
            bill: bill,
            totalCost: totalCost,
            userASplit: userASplit,
            userBSplit: userBSplit,
            userATime: userATime,
            userBTime: userBTime,
            totalTime: totalTime
        });
        
        userTotals.a += userASplit;
        userTotals.b += userBSplit;
    }
    
    return {
        month: document.getElementById('current-month').textContent,
        lines: reportLines,
        userTotals: userTotals
    };
}

function generatePDFContent(data) {
    const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
    ];
    
    let content = `
        <html>
        <head>
            <title>Bill Report - ${data.month}</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                h1 { color: #333; text-align: center; }
                table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                th { background-color: #f2f2f2; }
                .total-row { font-weight: bold; background-color: #f8f9fa; }
                .center { text-align: center; }
            </style>
        </head>
        <body>
            <h1>Bill Split Report - ${data.month}</h1>
            <table>
                <thead>
                    <tr>
                        <th>Bill</th>
                        <th>Total Cost</th>
                        <th>User A Time</th>
                        <th>User B Time</th>
                        <th>Total Time</th>
                        <th>User A Split</th>
                        <th>User B Split</th>
                    </tr>
                </thead>
                <tbody>
    `;
    
    data.lines.forEach(line => {
        content += `
            <tr>
                <td>${line.bill}</td>
                <td>$${line.totalCost.toFixed(2)}</td>
                <td>${formatTime(line.userATime)}</td>
                <td>${formatTime(line.userBTime)}</td>
                <td>${formatTime(line.totalTime)}</td>
                <td>$${line.userASplit.toFixed(2)}</td>
                <td>$${line.userBSplit.toFixed(2)}</td>
            </tr>
        `;
    });
    
    content += `
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td><strong>TOTALS</strong></td>
                        <td><strong>$${data.lines.reduce((sum, line) => sum + line.totalCost, 0).toFixed(2)}</strong></td>
                        <td><strong>${formatTime(data.lines.reduce((sum, line) => sum + line.userATime, 0))}</strong></td>
                        <td><strong>${formatTime(data.lines.reduce((sum, line) => sum + line.userBTime, 0))}</strong></td>
                        <td><strong>${formatTime(data.lines.reduce((sum, line) => sum + line.totalTime, 0))}</strong></td>
                        <td><strong>$${data.userTotals.a.toFixed(2)}</strong></td>
                        <td><strong>$${data.userTotals.b.toFixed(2)}</strong></td>
                    </tr>
                </tfoot>
            </table>
            <p><strong>Generated on:</strong> ${new Date().toLocaleDateString()}</p>
        </body>
        </html>
    `;
    
    return content;
}

function downloadPDF(content) {
    // Create a new window and print the content
    const printWindow = window.open('', '_blank');
    printWindow.document.write(content);
    printWindow.document.close();
    printWindow.focus();
    
    // Wait for content to load, then print
    setTimeout(() => {
        printWindow.print();
        printWindow.close();
    }, 250);
}
</script>
{% endblock %}
