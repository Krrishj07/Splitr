<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Splitter</title>
    <!-- Link to CSS File-->
    <link rel="stylesheet" href="splitterStyle.css">
</head>
<body>

    <header>
        <h1>Dynamic Splitter</h1>
    </header>

    <main>
        <!-- capture all the expense details -->
        <form id="expense-form">

            <!-- Basic Expense Details -->
            <fieldset>
                <legend>Expense Details</legend>
                
                <div class="form-group">
                    <label for="description">Description:</label>
                    <input type="text" id="description" placeholder="e.g., Dinner, Groceries" required>
                </div>

                <div class="form-group">
                    <label for="total-amount">Total Amount:</label>
                    <div class="amount-input-wrapper">
                        <span class="currency-symbol">$</span>
                        <input type="number" id="total-amount" placeholder="0.00" step="0.01" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="payer">Paid by:</label>
                    <select id="payer" required>
                        <option value="" disabled selected>-- Select who paid --</option>
                        <option value="Person A">Person A</option>
                        <option value="Person B">Person B</option>
                    </select>
                </div>
            </fieldset>

            <!--  How the bill should be split -->
            <fieldset>
                <legend>Split Method</legend>
                <div class="split-options">
                    <label>
                        <input type="radio" name="split-method" value="equally" checked> Equally
                    </label>
                    <label>
                        <input type="radio" name="split-method" value="percentage"> By Percentage
                    </label>
                    <label>
                        <input type="radio" name="split-method" value="amount"> By Exact Amount
                    </label>
                </div>
            </fieldset>

            <!-- Dynamic inputs that will appear based on the split method -->
            <div id="split-details">
                <!-- Percentage Inputs -->
                <div id="percentage-inputs" class="split-details-container hidden">
                    <div class="form-group">
                        <label for="person-a-percentage">Person A's Share (%):</label>
                        <input type="number" id="person-a-percentage" placeholder="e.g., 60" min="0" max="100">
                    </div>
                    <div class="form-group">
                        <label for="person-b-percentage">Person B's Share (%):</label>
                        <input type="number" id="person-b-percentage" placeholder="e.g., 40" min="0" max="100">
                    </div>
                </div>
                <!-- Exact Dollar Amount Inputs -->
                <div id="amount-inputs" class="split-details-container hidden">
                     <div class="form-group">
                        <label for="person-a-amount">Person A's Share ($):</label>
                        <input type="number" id="person-a-amount" step="0.01" placeholder="e.g., 25.50" min="0">
                    </div>
                    <div class="form-group">
                        <label for="person-b-amount">Person B's Share ($):</label>
                        <input type="number" id="person-b-amount" step="0.01" placeholder="e.g., 14.50" min="0">
                    </div>
                </div>
            </div>

            <!-- The main submit button -->
            <button type="submit">Add Expense</button>
        </form>

        <hr>

        <!-- Summary of who owes who for this specific expense -->
        <div id="results-section">
            <p>The expense breakdown will appear here once calculated.</p>
        </div>

        <hr>

        <!-- Final balances -->
        <div id="balances-section">
            <h2>Final Totals:</h2>
            <p>No data to show.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Dynamic Splitter</p>
    </footer>

    <!-- Link to the JavaScript file -->
    <script src="splitterScript.js"></script>
</body>
</html>
