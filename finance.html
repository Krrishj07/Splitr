<div class="finance-section">

    <div class="card">
        <h2>1. Enter Total Bill</h2>
        <div class="input-group">
            <span>$</span>
            <input type="number" id="total-bill" placeholder="e.g., 85.50" step="0.01">
        </div>
    </div>

    <button id="calculate-btn" class="calculate-btn">Calculate Split</button>

    <div id="results" class="card">
        <h2>💰 Bill Split Results</h2>
        
        <div class="result-item">
            <span class="person-name">Alice</span>
            <span class="amount-due">$42.75</span>
        </div>
        <div class="result-item">
            <span class="person-name">Bob</span>
            <span class="amount-due">$21.38</span>
        </div>
        <div class="result-item">
            <span class="person-name">Charlie</span>
            <span class="amount-due">$21.37</span>
        </div>
        
    </div>

</div>
